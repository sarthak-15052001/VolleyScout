# BoT-SORT tuned for long volleyball matches (fewer ID switches).
# Used when PipelineConfig.tracker points here.
tracker_type: botsort
track_high_thresh: 0.45
track_low_thresh: 0.10
new_track_thresh: 0.55
track_buffer: 120
match_thresh: 0.72
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: True
model: auto
